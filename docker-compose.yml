# Local development dependencies. Start everything with:
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: storefront-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ecommerce']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
